name: Create a New Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version component to bump (auto, patch, feature, yearly, or rc)'
        required: true
        type: choice
        default: auto
        options:
          - auto
          - patch
          - feature
          - yearly
          - rc

run-name: "Release ${{ inputs.bump }} bump on ${{ github.ref_name }}"

permissions:
  contents: write

jobs:
  release:
    uses: valkyrjaio/.github/.github/workflows/_php-create-release.yml@3812be12684beea1fbb95888e437a220f0813342
    secrets: inherit
    with:
      bump: ${{ inputs.bump }}
      dependencies: |
        [
          {"name": "Root Packages", "command": "root-outdated-check"},
          {"name": "Rector",  "command": "rector-outdated-check"}
        ]
      info-class-path: src/Rector/Constant/RectorInfo.php
      info-class-name: RectorInfo

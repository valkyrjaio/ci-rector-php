name: Create a New Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version component to bump (auto, patch, feature, yearly, or rc)'
        required: true
        type: choice
        default: auto
        options:
          - auto
          - patch
          - feature
          - yearly
          - rc

run-name: "Release ${{ inputs.bump }} bump on ${{ github.ref_name }}"

permissions:
  contents: write

jobs:
  release:
    uses: valkyrjaio/.github/.github/workflows/_php-create-release.yml@e3e801bdc0d696988d6fc331b6cf0d806b653abd
    secrets: inherit
    with:
      bump: ${{ inputs.bump }}
      dependencies: |
        [
          {"name": "Root Packages", "command": "root-outdated-check"},
          {"name": "Rector",  "command": "rector-outdated-check"}
        ]
      info-class-path: src/Rector/Constant/RectorInfo.php
      info-class-name: RectorInfo

  update-refs:
    name: Update Workflow Refs
    needs: release
    uses: valkyrjaio/.github/.github/workflows/_update-workflow-refs.yml@e3e801bdc0d696988d6fc331b6cf0d806b653abd
    secrets: inherit
    with:
      source-repo: ${{ github.event.repository.name }}

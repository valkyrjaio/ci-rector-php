name: Create a New Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version component to bump'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
          - rc

run-name: "Release ${{ inputs.bump }} bump on ${{ github.ref_name }}"

permissions:
  contents: write

jobs:
  release:
    uses: valkyrjaio/.github/.github/workflows/_php-create-release.yml@18d18f49ba631aad77b31da3edf729df91d9be36
    secrets: inherit
    with:
      bump: ${{ inputs.bump }}
      dependencies: |
        [
          {"name": "Root Packages", "command": "root-outdated-check"},
          {"name": "Rector",  "command": "rector-outdated-check"}
        ]
      info-class-path: src/Rector/Constant/RectorInfo.php
      info-class-name: RectorInfo

  update-refs:
    name: Update Workflow Refs
    needs: release
    uses: valkyrjaio/.github/.github/workflows/_update-workflow-refs.yml@18d18f49ba631aad77b31da3edf729df91d9be36
    secrets: inherit
    with:
      source-repo: ${{ github.event.repository.name }}
